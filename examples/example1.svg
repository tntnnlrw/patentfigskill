  <path d="M715 606 H815" class="edge"/>
  <text x="765" y="592" text-anchor="middle" class="edge-label">扰动对象</text>
  <path d="M1055 411 H1095 V920 H765 V852" class="edge"/>
  <text x="805" y="686" class="edge-label">完整性证据</text>
  <path d="M935 662 V710 H840 V740" class="edge"/>
