  <path d="M1252 445 V480" class="edge"/>
  <path d="M1457 445 V480" class="edge"/>
  <path d="M1252 610 V640" class="edge"/>
  <path d="M1457 610 V640" class="edge"/>

  <rect x="1260" y="800" width="190" height="72" rx="5" class="node"/>
