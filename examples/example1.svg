  <circle cx="1090" cy="796" r="10" class="port"/>
  <text x="1005" y="828" class="small">判定接口 270</text>
  <path d="M885 796 H1080" class="edge"/>

  <rect x="1130" y="85" width="430" height="825" rx="8" class="region"/>
  <text x="1152" y="125" class="region-title">门控动作域 300</text>
  <circle cx="1130" cy="221" r="10" class="port"/>
  <path d="M1100 796 H1110 V221 H1120" class="edge"/>
  <text x="1098" y="505" text-anchor="end" class="edge-label">XX证据与评估结果</text>
  <path d="M1140 221 H1200" class="edge"/>

  <polygon points="1345,140 1490,221 1345,302 1200,221" class="decision"/>
  <text x="1345" y="204" text-anchor="middle" class="node-title">证据完整且</text>
  <text x="1345" y="231" text-anchor="middle" class="node-title">变化可接受？</text>
  <text x="1345" y="258" text-anchor="middle" class="body">310</text>

  <rect x="1260" y="340" width="170" height="72" rx="5" class="node"/>
  <text x="1345" y="370" text-anchor="middle" class="node-title">处置路由 315</text>
  <text x="1345" y="396" text-anchor="middle" class="small">按缺口类型分派</text>
  <path d="M1345 302 V340" class="edge"/>

  <rect x="1170" y="480" width="165" height="100" rx="5" class="node"/>
  <text x="1252" y="514" text-anchor="middle" class="node-title">允许输出 320</text>
  <text x="1252" y="544" text-anchor="middle" class="body">结果稳定且证据完整</text>

  <rect x="1375" y="480" width="165" height="100" rx="5" class="node"/>
  <text x="1457" y="514" text-anchor="middle" class="node-title">参数修复 330</text>
  <text x="1457" y="544" text-anchor="middle" class="body">参数可确定性修复</text>

  <rect x="1170" y="640" width="165" height="100" rx="5" class="node"/>
  <text x="1252" y="674" text-anchor="middle" class="node-title">补充/确认 340</text>
  <text x="1252" y="704" text-anchor="middle" class="body">对象或基准信息存疑</text>

  <rect x="1375" y="640" width="165" height="100" rx="5" class="node"/>
  <text x="1457" y="674" text-anchor="middle" class="node-title">隔离结果 350</text>
  <text x="1457" y="704" text-anchor="middle" class="body">高风险且不可修复</text>

  <path d="M1252 445 H1457 M1345 445 V610 M1252 610 H1457" class="bus"/>
  <text x="1180" y="461" class="small">稳定</text>
  <text x="1460" y="461" class="small">可修复</text>
  <text x="1180" y="626" class="small">需核验</text>
  <text x="1460" y="626" class="small">不可修复</text>
