  <text x="1355" y="856" text-anchor="middle" class="small">动作、原因、修复与索引</text>
  <path d="M1252 580 V600 H1145 V770 M1252 740 V770 M1457 580 V600 H1550 V770 M1457 740 V770 M1145 770 H1550" class="bus"/>
  <path d="M1355 770 V800" class="edge"/>

  <text x="800" y="1017" text-anchor="middle" class="figure-no">图1</text>
